<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Tournament Entry</title>
    <style>
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; background: #0f172a; 
            font-family: 'Segoe UI', sans-serif; color: white; padding: 20px; 
        }
        .card { 
            background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; 
            max-width: 400px; border: 1px solid #3b82f6; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px; box-sizing: border-box;
        }
        h2 { text-align: center; margin: 0 0 20px 0; color: #3b82f6; text-transform: uppercase; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 2px; }
        input { 
            width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; 
            border: 1px solid #334155; border-radius: 8px; color: white; box-sizing: border-box; 
        }
        input:focus { border-color: #3b82f6; outline: none; }
        button { 
            width: 100%; padding: 14px; background: #3b82f6; border: none; 
            color: white; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        .status-box { 
            background: #0f172a; padding: 15px; border-radius: 8px; 
            margin-top: 15px; display: none; border-left: 4px solid #3b82f6;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🏆 Squad Entry</h2>
    <form id="regForm">
        <label>Team Name</label>
        <input type="text" id="teamName" placeholder="Enter Team Name" required>
        <label>Leader Name (IGN)</label>
        <input type="text" id="leaderName" placeholder="Leader Name" required>
        <label>Player Name</label>
        <input type="text" id="pName" placeholder="Your Name" required>
        <label>UID</label>
        <input type="number" id="pUID" placeholder="Your UID" required>
        <label>Level (20+ Only)</label>
        <input type="number" id="pLevel" placeholder="Min 20" min="20" required>
        <label>Reason (Optional)</label>
        <input type="text" id="pReason" placeholder="Write something...">
        <button type="submit" id="submitBtn">Submit Entry</button>
    </form>
</div>

<div class="card">
    <h3>🔍 Check Status</h3>
    <input type="number" id="searchUID" placeholder="Enter UID to check">
    <button onclick="checkStatus()" style="background: #10b981;">Check Result</button>
    <div id="statusResult" class="status-box"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- PASTE YOUR CONFIG HERE ---
    const firebaseConfig = {
        apiKey: "AIzaSyB9NhZECekauKgSSj8o8JhcUevOcXLwk70",
        authDomain: "ff-entry.firebaseapp.com",
        projectId: "ff-entry",
        storageBucket: "ff-entry.firebasestorage.app",
        messagingSenderId: "470845638875",
        appId: "1:470845638875:web:6e91c8ae22aedbc437e4fe",
        measurementId: "G-K3K5V0YMQT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('regForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = "Processing...";
        try {
            await addDoc(collection(db, "registrations"), {
                team: document.getElementById('teamName').value,
                leader: document.getElementById('leaderName').value,
                playerName: document.getElementById('pName').value,
                playerUID: document.getElementById('pUID').value,
                playerLevel: Number(document.getElementById('pLevel').value),
                reason: document.getElementById('pReason').value,
                status: "pending",
                adminReason: "",
                submittedAt: serverTimestamp()
            });
            alert("✅ Entry Submitted!");
            form.reset();
        } catch (err) { alert(err.message); }
        btn.disabled = false; btn.innerText = "Submit Entry";
    });

    window.checkStatus = async () => {
        const uid = document.getElementById('searchUID').value;
        const resDiv = document.getElementById('statusResult');
        const q = query(collection(db, "registrations"), where("playerUID", "==", uid));
        const snap = await getDocs(q);
        resDiv.style.display = "block";
        if (snap.empty) { resDiv.innerHTML = "❌ No entry found."; }
        else {
            snap.forEach(doc => {
                const d = doc.data();
                resDiv.innerHTML = `<p>Status: <b style="color:#3b82f6">${d.status.toUpperCase()}</b></p>
                                    <p>Admin Msg: ${d.adminReason || "Pending review..."}</p>`;
            });
        }
    };
</script>
</body>
</html>
