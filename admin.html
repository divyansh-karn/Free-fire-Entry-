<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #3b82f6; margin-bottom: 20px; }
        .flex { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: #10b981; color: white; }
        .btn-red { background: #ef4444; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #3b82f6; font-size: 13px; }
    </style>
</head>
<body>

<div class="box">
    <h3 style="color:#3b82f6; margin-top:0;">📝 Tournament Display Settings</h3>
    <div class="flex">
        <div><label>Mode</label><select id="mMode"><option value="BR Match">BR Match</option><option value="CS Match">CS Match</option></select></div>
        <div><label>Time</label><input type="text" id="mTime" placeholder="Eg: 09:00 PM"></div>
        <div><label>Date</label><input type="text" id="mDate" placeholder="Eg: 25 Feb"></div>
        <div><label>Prize</label><input type="number" id="mPrize" placeholder="₹"></div>
        <button onclick="updateInfo()">Update Player Page</button>
    </div>
</div>

<div class="box">
    <h3 style="color:#10b981; margin-top:0;">🎮 Live Room ID/Pass</h3>
    <div class="flex">
        <input type="text" id="rId" placeholder="Room ID">
        <input type="text" id="rPass" placeholder="Password">
        <button onclick="updateRoom()">Set ID/Pass</button>
    </div>
</div>

<div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>📩 Registered Players</h2>
    <button class="btn-red" onclick="resetAll()">🗑️ Clear All Data</button>
</div>

<table>
    <thead><tr><th>Mode</th><th>Team/Leader</th><th>Player (UID)</th></tr></thead>
    <tbody id="tbody"></tbody>
</table>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9NhZECekauKgSSj8o8JhcUevOcXLwk70",
        authDomain: "ff-entry.firebaseapp.com",
        projectId: "ff-entry",
        appId: "1:470845638875:web:6e91c8ae22aedbc437e4fe"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.updateInfo = async () => {
        await setDoc(doc(db, "settings", "matchDetails"), {
            mode: document.getElementById('mMode').value,
            time: document.getElementById('mTime').value,
            date: document.getElementById('mDate').value,
            prize: document.getElementById('mPrize').value
        });
        alert("Match Info Updated!");
    };

    window.updateRoom = async () => {
        await setDoc(doc(db, "settings", "roomDetails"), {
            id: document.getElementById('rId').value,
            pass: document.getElementById('rPass').value
        });
        alert("Room Details Updated!");
    };

    onSnapshot(query(collection(db, "registrations"), orderBy("submittedAt", "desc")), (snap) => {const tb = document.getElementById('tbody');
        tb.innerHTML = "";
        snap.forEach(dDoc => {
            const d = dDoc.data();
            tb.innerHTML += <tr>
                <td><b>${d.matchMode}</b><br><small>${d.entryMode}</small></td>
                <td><b>${d.team}</b><br><small>${d.leader}</small></td>
                <td>${d.playerName}<br><small>${d.playerUID}</small></td>
            </tr>;
        });
    });

    window.resetAll = async () => {
        if(confirm("Sare players delete karein?")){
            const snap = await getDocs(collection(db, "registrations"));
            snap.forEach(d => deleteDoc(doc(db, "registrations", d.id)));
        }
    };
</script>
</body>
</html>
